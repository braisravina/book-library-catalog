; PHP-FPM pool overrides for the application.
[www]
listen = 9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Pass container environment (DB_*, APP_*) through to PHP.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Only .php front controllers may execute.
security.limit_extensions = .php

; Web requests never need to spawn processes.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
php_admin_flag[expose_php] = off
