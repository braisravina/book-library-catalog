# Digital Library Archive - client IP trust policy (http context).
# Included by default.conf; mounted at /etc/nginx/dla/client-ip.conf.
#
# SHIPPED DEFAULT: TRUST NO PROXY.
# $remote_addr (REMOTE_ADDR for PHP) is the TCP peer. Every forwarding header
# (CF-Connecting-IP, X-Forwarded-For, Forwarded, X-Real-IP, ...) is ignored
# here and removed before the request reaches PHP (see default.conf), so no
# client can choose the address used for rate limiting or the audit log.
#
# Behind Cloudflare/cloudflared or another reverse proxy, every visitor then
# shares the proxy's address (one login rate-limit bucket for everyone) until
# this file is replaced with one of the reviewed templates:
#     client-ip.cloudflared.conf.example
#     client-ip.reverse-proxy.conf.example
# Only do that once the proxy's source address, as seen from the nginx
# container, has been verified. See ARCHITECTURE.md "Client IP behind a
# reverse proxy". Test any change with tests/nginx/run.php.

# 1 = refuse (403) every request that did not come from a trusted proxy with
# a valid client address (direct-origin protection), except /health.
# Must stay 0 while no proxy is trusted.
map $uri $dla_require_trusted_proxy {
    default 0;
}
