# Digital Library Archive — Nginx vhost.
# TLS is expected to terminate at the existing Bravina reverse proxy in front
# of this container; see ARCHITECTURE.md.

server_tokens off;

# Invitation links in the "query" format carry a one-time token in the query
# string of a single request (GET /invite?token=...). Keep every request that
# carries a token parameter out of the access log, whatever the path spelling
# (/invite/?token=, //invite?token=, /%69nvite?token= all reach the same
# handler). Fragment links (/invite/redeem#token, INVITATION_LINK_FORMAT=
# fragment) never send the token in a URL at all; prefer them in production.
#
# Error log: PHP writes its errors to the FPM process's stderr
# (docker/php/php.ini error_log=/proc/self/fd/2, catch_workers_output), not
# back through FastCGI, so application errors are never paired with the
# request line here. Nginx's own upstream errors (e.g. PHP-FPM unreachable)
# still include the request line, which for a query-format link contains the
# token. They are kept for diagnostics; see SECURITY.md "Invitation tokens".
map $request_uri $dla_loggable {
    ~*[?&]token=  0;
    default       1;
}

# Client IP trust policy: which peers may report client addresses
# (real_ip) and whether direct requests are refused. The shipped file
# trusts no proxy. See client-ip.conf and ARCHITECTURE.md.
include /etc/nginx/dla/client-ip.conf;

# 1 when $remote_addr was NOT replaced with an address reported by a trusted
# proxy: a direct client, an untrusted peer, or a trusted peer that sent no
# (or a malformed) client address.
map "$remote_addr|$realip_remote_addr" $dla_client_ip_unverified {
    "~^([^|]+)\|\1$"  1;
    default           0;
}

# 1 when the Host header PHP receives names the host nginx itself used.
# Refuses absolute-form request targets with a different Host header
# ("GET http://other.example/ HTTP/1.1" + "Host: library..."); the
# application then validates the Host, including its port, against APP_URL.
map "$host|$http_host" $dla_host_consistent {
    "~*^([^|]+)\|\1(:[0-9]{1,5})?$"  1;
    default                          0;
}

# Refusals, evaluated before any location. Fixed-width fields first and the
# URI last, so no path can shift the fields. /health stays reachable for
# local container probes.
map "$dla_host_consistent|$dla_require_trusted_proxy$dla_client_ip_unverified|$uri" $dla_refuse {
    "~^[01]\|[01][01]\|/health$"  "";
    "~^0\|"                       400;
    "~^1\|11\|"                   403;
    default                       "";
}

# The combined format plus the TCP peer, so a rewritten client address can
# always be traced to the proxy that reported it.
log_format dla '$remote_addr - $remote_user [$time_local] "$request" $status '
               '$body_bytes_sent "$http_referer" "$http_user_agent" peer=$realip_remote_addr';

server {
    listen 8080 default_server;
    server_name _;

    # Client IP behind a reverse proxy: configured in client-ip.conf (above),
    # never here. Header names with underscores are dropped
    # (underscores_in_headers off, the default), so "X_Forwarded_For" cannot
    # alias a stripped header.

    if ($dla_refuse = 400) {
        return 400;
    }
    if ($dla_refuse = 403) {
        return 403;
    }

    access_log /var/log/nginx/access.log dla if=$dla_loggable;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 8m;
    client_body_timeout 30s;

    # Static assets: long cache, no PHP.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /favicon.ico {
        try_files /assets/img/favicon.svg =404;
        access_log off;
    }

    # Never serve dotfiles or anything that is not in public/.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Everything else goes through the front controller.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Only the front controller may execute; any other .php path is a 404.
    location = /index.php {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTP_PROXY "";
        # The raw Host header, validated by the application against APP_URL
        # (host and port) and by $dla_host_consistent above. Explicit, so it
        # does not depend on the distribution's fastcgi_params (Debian's maps
        # HTTP_HOST to $host, which drops the port).
        fastcgi_param HTTP_HOST $http_host;
        # Forwarding headers never reach PHP. The client address arrives only
        # as REMOTE_ADDR (rewritten by real_ip for trusted proxies), so no
        # application code can be tricked into reading a forged value.
        fastcgi_param HTTP_X_FORWARDED_FOR "";
        fastcgi_param HTTP_X_FORWARDED_HOST "";
        fastcgi_param HTTP_X_FORWARDED_PROTO "";
        fastcgi_param HTTP_X_FORWARDED_PORT "";
        fastcgi_param HTTP_X_FORWARDED_SERVER "";
        fastcgi_param HTTP_FORWARDED "";
        fastcgi_param HTTP_X_REAL_IP "";
        fastcgi_param HTTP_X_CLIENT_IP "";
        fastcgi_param HTTP_X_ORIGINAL_HOST "";
        fastcgi_param HTTP_X_ORIGINAL_URL "";
        fastcgi_param HTTP_X_REWRITE_URL "";
        fastcgi_param HTTP_CF_CONNECTING_IP "";
        fastcgi_param HTTP_CF_CONNECTING_IPV6 "";
        fastcgi_param HTTP_TRUE_CLIENT_IP "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
