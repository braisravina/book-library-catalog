# Digital Library Archive — Nginx vhost.
# TLS is expected to terminate at the existing Bravina reverse proxy in front
# of this container; see ARCHITECTURE.md.

server_tokens off;

server {
    listen 80 default_server;
    server_name _;

    # Client IP behind a reverse proxy (REQUIRED before deployment).
    # Leave this disabled until the proxy's address, as seen from inside
    # this container, has been confirmed. Replace the placeholder with that
    # exact address or the narrowest CIDR covering only the proxy. Never use
    # a broad range or 0.0.0.0/0: any host in the range could forge client
    # IPs. See ARCHITECTURE.md "Client IP behind a reverse proxy".
    # set_real_ip_from <PROXY_ADDRESS_OR_NARROW_CIDR>;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 8m;
    client_body_timeout 30s;

    # Static assets: long cache, no PHP.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /favicon.ico {
        try_files /assets/img/favicon.svg =404;
        access_log off;
    }

    # Never serve dotfiles or anything that is not in public/.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Everything else goes through the front controller.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Only the front controller may execute; any other .php path is a 404.
    location = /index.php {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
