# Digital Library Archive - production main configuration (docker/nginx/Dockerfile).
#
# The whole server runs as the unprivileged "nginx" user on a read-only root
# filesystem: no "user" directive, the PID file and every temporary path
# under /tmp (a tmpfs in docker-compose.prod.yml), errors to stderr.
# The site itself is conf.d/default.conf (docker/nginx/default.conf), shared
# with development; the client IP policy is mounted at
# /etc/nginx/dla/client-ip.conf and checked by entrypoint-prod.sh.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
