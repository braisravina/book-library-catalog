# Digital Library Archive - PRODUCTION stack.
#
# Ingress (Phase 5B): the owner's EXISTING Cloudflare Tunnel, served by the
# cloudflared systemd service on this Docker host, reaches nginx through
# ONE published loopback port; no cloudflared container, service or tunnel
# is part of this stack. Cloudflare -> cloudflared (host) ->
# http://127.0.0.1:<DLA_HTTP_PORT> -> nginx:8080 -> php-fpm -> MySQL.
# Fail closed: Compose refuses to run until DLA_HTTP_BIND, DLA_HTTP_PORT,
# DLA_EDGE_SUBNET and DLA_EDGE_GATEWAY are set (no defaults), and nginx
# refuses to start without the client IP policy. See docs/DEPLOYMENT.md,
# section 0, and ARCHITECTURE.md, "Production ingress".
#
# On the Docker host, from the deployed working tree /opt/digital-library
# (checked out from the bare repository; never a clone with .git inside):
#   cp .env.production.example .env.production   # review; never commit it
#   (create the data directories, secrets and the installed preflight once:
#   docs/DEPLOYMENT.md, sections 2 and 3)
#   sudo /usr/local/sbin/digital-library-preflight --env-file /opt/digital-library/.env.production --existing-installation   # read-only (first deployment: section 6)
#   (after the first deployment: enable digital-library.service, the only
#   boot path; DEPLOYMENT.md 3.4)
#   docker compose -f docker-compose.prod.yml --env-file .env.production build
#   (first deployment only: authorise the new, empty database; section 6)
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d db
#   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm ops php bin/console migrate
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Least privilege:
#   nginx  static assets and FastCGI only; unprivileged, read-only, no secrets
#   php    web requests (APP_ROLE=web): runtime database account only
#   ops    one-off CLI work (APP_ROLE=ops; migrate, backups, restore, cleanup):
#          runtime + migration accounts; started only with "run --rm ops ..."
#   db     MySQL; the only container with the root password (root@localhost)
# Only nginx publishes a port, on loopback only (the entrypoint refuses any
# other address). PHP-FPM and MySQL are
# never published: frontend and backend are internal networks (no route
# outside Docker); only nginx joins edge (the published port) and only php
# joins egress (ISBN metadata lookups).

name: digital-library-prod

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: digital-library-nginx:${APP_IMAGE_TAG:-prod}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      # PENDING TOPOLOGY APPROVAL: "required" with the approved policy, or
      # "none" as an explicit decision. Unset, nginx refuses to start.
      DLA_TRUSTED_PROXY: ${DLA_TRUSTED_PROXY:-}
      # The host address of the published port (below), so the entrypoint
      # can refuse anything but loopback. Same variable, so it cannot disagree.
      DLA_HTTP_BIND: ${DLA_HTTP_BIND:-}
      # Gateway of the edge network: the TCP peer of every connection that
      # arrives through the published port (Docker's port proxy / loopback
      # NAT). With DLA_TRUSTED_PROXY=required the policy must trust exactly
      # this address.
      DLA_EDGE_GATEWAY: ${DLA_EDGE_GATEWAY:-}
    ports:
      # The origin of the tunnel route (http://127.0.0.1:<DLA_HTTP_PORT>).
      # No defaults (Compose stops with an error until both are set):
      #   DLA_HTTP_BIND  127.0.0.1: cloudflared runs on this host (systemd);
      #                  the port is never reachable from the network.
      #   DLA_HTTP_PORT  a free host port (8089 is only a candidate; check).
      - target: 8080
        host_ip: ${DLA_HTTP_BIND:?set DLA_HTTP_BIND in .env.production (see docs/DEPLOYMENT.md, Cloudflare Tunnel route)}
        published: "${DLA_HTTP_PORT:?set DLA_HTTP_PORT in .env.production (see docs/DEPLOYMENT.md, Cloudflare Tunnel route)}"
        protocol: tcp
    volumes:
      # The approved client IP policy goes in this directory as
      # client-ip.conf (PENDING; see docker/nginx/production/README.md).
      - ./docker/nginx/production:/etc/nginx/dla:ro
    networks:
      - frontend
      - edge
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Never started by the Docker daemon itself (not even after a reboot or
    # an unclean shutdown): only digital-library.service starts the stack,
    # after the storage preflight (docs/DEPLOYMENT.md, section 3.4).
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    image: digital-library-php:${APP_IMAGE_TAG:-prod}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m,mode=1777
    env_file:
      - .env.production
    environment:
      APP_ROLE: web
      DB_HOST: db
      DB_PORT: "3306"
      DB_PASSWORD_FILE: /run/secrets/db_password
      # Never in the web container, whatever .env.production contains.
      DB_MIGRATION_USERNAME: ""
      DB_MIGRATION_PASSWORD: ""
      DB_MIGRATION_PASSWORD_FILE: ""
      DB_ROOT_PASSWORD: ""
      DB_ROOT_PASSWORD_FILE: ""
    secrets:
      - db_password
    volumes:
      # Host directories on the storage disk (section "Persistent storage"
      # below). Never backups or MySQL data in the web container.
      - type: bind
        source: ${DLA_STORAGE_ROOT:?set DLA_STORAGE_ROOT in .env.production (see docs/DEPLOYMENT.md, section 3)}/storage
        target: /var/www/html/storage
        bind:
          create_host_path: false
      - type: bind
        source: ${DLA_STORAGE_ROOT:?set DLA_STORAGE_ROOT in .env.production (see docs/DEPLOYMENT.md, section 3)}/covers
        target: /var/www/html/storage/covers
        bind:
          create_host_path: false
    networks:
      - frontend
      - backend
      - egress
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Never started by the Docker daemon itself (not even after a reboot or
    # an unclean shutdown): only digital-library.service starts the stack,
    # after the storage preflight (docs/DEPLOYMENT.md, section 3.4).
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  ops:
    profiles:
      - ops
    image: digital-library-php:${APP_IMAGE_TAG:-prod}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m,mode=1777
    env_file:
      - .env.production
    environment:
      APP_ROLE: ops
      DB_HOST: db
      DB_PORT: "3306"
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_MIGRATION_PASSWORD_FILE: /run/secrets/db_migration_password
      DB_ROOT_PASSWORD: ""
      DB_ROOT_PASSWORD_FILE: ""
    secrets:
      - db_password
      - db_migration_password
    volumes:
      - type: bind
        source: ${DLA_STORAGE_ROOT:?set DLA_STORAGE_ROOT in .env.production (see docs/DEPLOYMENT.md, section 3)}/storage
        target: /var/www/html/storage
        bind:
          create_host_path: false
      - type: bind
        source: ${DLA_STORAGE_ROOT:?set DLA_STORAGE_ROOT in .env.production (see docs/DEPLOYMENT.md, section 3)}/covers
        target: /var/www/html/storage/covers
        bind:
          create_host_path: false
      - type: bind
        source: ${DLA_STORAGE_ROOT:?set DLA_STORAGE_ROOT in .env.production (see docs/DEPLOYMENT.md, section 3)}/backups
        target: /var/www/html/storage/backups
        bind:
          create_host_path: false
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    command:
      - php
      - bin/console
      - help
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  db:
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_ROOT_HOST: localhost
      MYSQL_DATABASE: ${DB_DATABASE:?set DB_DATABASE (run with --env-file .env.production)}
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME (run with --env-file .env.production)}
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:?set DB_MIGRATION_USERNAME (run with --env-file .env.production)}
      DB_MIGRATION_PASSWORD_FILE: /run/secrets/db_migration_password
    secrets:
      - db_root_password
      - db_password
      - db_migration_password
    # The image's entrypoint runs only after docker/mysql/db-guard.sh: with no
    # database in /var/lib/mysql it refuses to initialise a new, empty one
    # unless the owner has authorised a first deployment (an
    # allow-empty-init file in <data>/mysql-init-guard; section 3).
    entrypoint:
      - /usr/local/bin/dla-db-guard
    command:
      - mysqld
    volumes:
      # MySQL data on the system SSD, in the data root outside the working
      # tree, so outside Git and every build context. Never a named volume,
      # never created on demand: a missing directory stops db instead of
      # starting an empty database.
      - type: bind
        source: ${DLA_DATA_ROOT:?set DLA_DATA_ROOT in .env.production (see docs/DEPLOYMENT.md, section 3)}/mysql
        target: /var/lib/mysql
        bind:
          create_host_path: false
      - type: bind
        source: ${DLA_DATA_ROOT:?set DLA_DATA_ROOT in .env.production (see docs/DEPLOYMENT.md, section 3)}/mysql-init-guard
        target: /run/dla-db-init
        read_only: true
        bind:
          create_host_path: false
      - ./docker/mysql/db-guard.sh:/usr/local/bin/dla-db-guard:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/app.cnf:ro
    networks:
      - backend
    healthcheck:
      # Liveness without credentials: mysqladmin ping succeeds whenever the
      # server answers, even with "access denied". 127.0.0.1 (TCP) stays
      # unreachable while the image initialises with networking disabled.
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
        - --silent
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    stop_grace_period: 60s
    # Never started by the Docker daemon itself (not even after a reboot or
    # an unclean shutdown): only digital-library.service starts the stack,
    # after the storage preflight (docs/DEPLOYMENT.md, section 3.4).
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  # nginx <-> php-fpm. Internal: no route to or from outside Docker.
  frontend:
    internal: true
  # php/ops <-> MySQL. Internal.
  backend:
    internal: true
  # The published port only (nginx alone; Docker cannot publish a port of a
  # container that is only on internal networks). Not shared with any other
  # project; cloudflared reaches it through the loopback port. Fixed subnet,
  # so its gateway (the address nginx trusts) never changes: pick a free
  # range on this host (docs/DEPLOYMENT.md 0.1); no default.
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: ${DLA_EDGE_SUBNET:?set DLA_EDGE_SUBNET in .env.production (see docs/DEPLOYMENT.md, section 0)}
          gateway: ${DLA_EDGE_GATEWAY:?set DLA_EDGE_GATEWAY in .env.production (see docs/DEPLOYMENT.md, section 0)}
  # Outbound HTTPS for ISBN metadata lookups (php only). Restrict egress on
  # the Docker host firewall; with METADATA_PROVIDERS=none it can be removed.
  egress:
    driver: bridge

# Persistent storage (Phase 5C, split layout): host directories, never
# named volumes, never /mnt/dockerdata. Neither root has a default (Compose
# refuses to run until both are set; the template sets the owner-confirmed
# paths). Every source must already exist: "create_host_path: false" makes
# Compose refuse to create a missing one, and Docker refuses to start a
# container whose source is missing.
#   System SSD, code: /opt/digital-library, the deployed working tree of
#   this repository (the Compose project directory and build context; Git
#   objects in the bare repository /home/brais/git/digital-library.git).
#   No production data there.
#   System SSD, data: DLA_DATA_ROOT (/opt/digital-library-data, root:root
#   0755), outside the working tree:
#     mysql/     999:999 0700  db only (/var/lib/mysql)
#     secrets/   root:root 0700; files as in ARCHITECTURE.md "Production secrets"
#     mysql-init-guard/  root:root 0755, db only, read-only: holds
#                allow-empty-init only during a first deployment
#   Storage HDD, DLA_STORAGE_ROOT (/mnt/bravina-shared/digital-library,
#   ext4 UUID ad62670f-861d-47a4-a68d-967272d27866):
#     storage/    82:82 0750  php, ops (tmp, cache, logs, maintenance flag)
#     covers/     82:82 0750  php, ops (storage/covers)
#     backups/    82:82 0700  ops only (storage/backups)
#     books/      reserved (future PDF/EPUB); not created, not mounted
# Restart policies are "no": after a reboot the Docker daemon starts none of
# these containers; digital-library.service (systemd, not a change to
# docker.service) starts them only after the read-only preflight has
# verified both disks, so no container can bypass it. Owners come from the
# images (mysql 999, www-data 82). Initialisation, preflight and the boot
# unit: docs/DEPLOYMENT.md, section 3.

# Docker secrets read from files in the data root on the SSD, outside the
# working tree (never committed, never in a build context). Ownership and modes: ARCHITECTURE.md "Production secrets".
secrets:
  db_root_password:
    file: ${DLA_DATA_ROOT:?set DLA_DATA_ROOT in .env.production (see docs/DEPLOYMENT.md, section 3)}/secrets/db_root_password
  db_password:
    file: ${DLA_DATA_ROOT:?set DLA_DATA_ROOT in .env.production (see docs/DEPLOYMENT.md, section 3)}/secrets/db_password
  db_migration_password:
    file: ${DLA_DATA_ROOT:?set DLA_DATA_ROOT in .env.production (see docs/DEPLOYMENT.md, section 3)}/secrets/db_migration_password
