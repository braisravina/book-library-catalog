# Digital Library Archive - continuous integration (Phase 5A Batch 7).
#
# Jobs:
#   test              PHP 8.4: Composer checks, lint, full PHPUnit suite against
#                     MariaDB 11.4, the production database image (dedicated
#                     test accounts), nginx behaviour checks
#   test-mysql        PHP 8.4: the full PHPUnit suite against MySQL 8.4, kept as a
#                     regression check (development compatibility; engine-
#                     specific code paths and the released migration files)
#   unit-php83        PHP 8.3 compatibility: lint and unit suite
#   static            shellcheck, Dockerfile lint, Compose validation
#   production-stack  builds the production images, starts docker-compose.prod.yml
#                     (nginx published on the runner's loopback only), checks
#                     the hardening, the CPU baseline of the images (the
#                     production CPU has no SSE4.1/SSE4.2/POPCNT), the
#                     database accounts, and runs a backup / restore drill
#                     with the ops container
#
# Security: read-only token, no secrets, no pull_request_target, checkout
# without persisted credentials, actions pinned to full commit SHAs, pinned
# images. Every password below is a throwaway value for this runner only.
# The production ingress (trusted proxy) is NOT configured here: the
# production-stack job uses DLA_TRUSTED_PROXY=none with the trust-nothing
# policy, publishes nginx on 127.0.0.1 of the runner only (as the Docker
# host's cloudflared reaches it), then checks the production trusted-peer
# policy with the edge gateway, and talks to no tunnel or Cloudflare service.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly (Monday 05:17 UTC): dependency audit and restore drill against
    # unchanged code, so new advisories or image regressions surface.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP 8.4 - suite on MariaDB 11.4, lint, nginx
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        # The production database image (docker-compose.prod.yml), a
        # disposable instance for this run only.
        image: mariadb:11.4.13-noble@sha256:5e73baf8179b29f115101bb102763a47a017361f3e9792daccba6646c3ab1532
        env:
          MARIADB_ROOT_PASSWORD: ci_root_password
          MARIADB_DATABASE: library_test
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping -h 127.0.0.1 --silent" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      # The application database is never created in CI; the integration
      # suite refuses to run unless DB_TEST_DATABASE ends in "_test", differs
      # from DB_DATABASE and is reached through dedicated test accounts.
      DB_DATABASE: library
      DB_TEST_DATABASE: library_test
      DB_USERNAME: library_app
      DB_PASSWORD: ci_app_password
      DB_MIGRATION_USERNAME: library_migrator
      DB_MIGRATION_PASSWORD: ci_migration_password
      DB_TEST_USERNAME: library_test_app
      DB_TEST_PASSWORD: ci_test_app_password
      DB_TEST_MIGRATION_USERNAME: library_test_migrator
      DB_TEST_MIGRATION_PASSWORD: ci_test_migration_password
      DB_TEST_REQUIRE_DEDICATED_ACCOUNTS: "true"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP 8.4 (with PHP-FPM for the nginx checks)
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: pdo_mysql, gd, mbstring, fileinfo, sodium
          coverage: none
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit dependencies for known vulnerabilities
        run: composer audit --no-interaction

      - name: Lint PHP
        run: composer lint

      - name: Confirm the database engine
        run: |
          version=$(mysql -h 127.0.0.1 -uroot -pci_root_password -N -e 'SELECT VERSION()')
          echo "server: $version"
          case "$version" in 11.4.*-MariaDB*) ;; *) echo "::error::expected MariaDB 11.4, got $version" >&2; exit 1 ;; esac

      - name: Create least-privilege test database accounts
        run: |
          mysql -h 127.0.0.1 -uroot -pci_root_password <<'SQL'
          CREATE USER 'library_test_app'@'%' IDENTIFIED BY 'ci_test_app_password';
          CREATE USER 'library_test_migrator'@'%' IDENTIFIED BY 'ci_test_migration_password';
          GRANT SELECT, INSERT, UPDATE, DELETE ON `library_test`.* TO 'library_test_app'@'%';
          GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, INDEX, REFERENCES ON `library_test`.* TO 'library_test_migrator'@'%';
          SQL

      - name: Run the full test suite
        # --fail-on-skipped: GD cover tests and the database integration suite
        # must actually run on PHP 8.4 here, never silently skip.
        run: vendor/bin/phpunit --fail-on-skipped --fail-on-warning

      - name: Install nginx for the behaviour checks
        run: |
          if ! command -v nginx >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends nginx
          fi
          # The runner's own nginx service is not needed (the checks start
          # their own unprivileged instance on loopback high ports).
          sudo systemctl stop nginx 2>/dev/null || true
          nginx -v

      - name: Run the nginx behaviour checks
        # Exit status 2 (nginx or PHP-FPM missing) fails the job too.
        run: php tests/nginx/run.php

  test-mysql:
    name: PHP 8.4 - suite on MySQL 8.4 (regression)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        # Not used in production (its Oracle Linux 9 base needs x86-64-v2,
        # which the production CPU lacks); kept so engine-specific code and
        # the released migrations stay correct on MySQL.
        image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: library_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 --silent" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: library
      DB_TEST_DATABASE: library_test
      DB_USERNAME: library_app
      DB_PASSWORD: ci_app_password
      DB_MIGRATION_USERNAME: library_migrator
      DB_MIGRATION_PASSWORD: ci_migration_password
      DB_TEST_USERNAME: library_test_app
      DB_TEST_PASSWORD: ci_test_app_password
      DB_TEST_MIGRATION_USERNAME: library_test_migrator
      DB_TEST_MIGRATION_PASSWORD: ci_test_migration_password
      DB_TEST_REQUIRE_DEDICATED_ACCOUNTS: "true"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: pdo_mysql, gd, mbstring, fileinfo, sodium
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Confirm the database engine
        run: |
          version=$(mysql -h 127.0.0.1 -uroot -pci_root_password -N -e 'SELECT VERSION()')
          echo "server: $version"
          case "$version" in 8.4.*) ;; *) echo "::error::expected MySQL 8.4, got $version" >&2; exit 1 ;; esac

      - name: Create least-privilege test database accounts
        run: |
          mysql -h 127.0.0.1 -uroot -pci_root_password <<'SQL'
          CREATE USER 'library_test_app'@'%' IDENTIFIED BY 'ci_test_app_password';
          CREATE USER 'library_test_migrator'@'%' IDENTIFIED BY 'ci_test_migration_password';
          GRANT SELECT, INSERT, UPDATE, DELETE ON `library_test`.* TO 'library_test_app'@'%';
          GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, INDEX, REFERENCES ON `library_test`.* TO 'library_test_migrator'@'%';
          SQL

      - name: Run the full test suite
        run: vendor/bin/phpunit --fail-on-skipped --fail-on-warning

  unit-php83:
    name: PHP 8.3 - lint and unit suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          extensions: pdo_mysql, pdo_sqlite, gd, mbstring, fileinfo, sodium
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint PHP
        run: composer lint

      - name: Run the unit suite
        run: vendor/bin/phpunit --testsuite unit --fail-on-skipped --fail-on-warning

  static:
    name: Shell, Dockerfile and Compose checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck --severity=warning --shell=bash docker/discovery/docker-host.sh docker/mysql/init/01-create-users.sh docker/storage/preflight.sh
          shellcheck --severity=warning --shell=sh docker/nginx/entrypoint-prod.sh docker/php/entrypoint-prod.sh docker/php/entrypoint-dev.sh docker/mysql/db-guard.sh

      - name: Lint Dockerfiles
        run: |
          docker build --check -f docker/php/Dockerfile .
          docker build --check -f docker/nginx/Dockerfile .

      - name: Validate the Compose files
        run: |
          # Throwaway inputs for this runner only (never committed).
          cp .env.example .env
          docker compose config --quiet
          cp .env.production.example .env.production
          # CI only: the data root on the runner, outside this checkout as
          # in production (/opt/digital-library-data, outside the working tree).
          sed -i 's#^DLA_DATA_ROOT=.*#DLA_DATA_ROOT=/srv/dla-ci-data#' .env.production
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 /srv/dla-ci-data /srv/dla-ci-data/secrets
          for name in db_root_password db_password db_migration_password; do
            openssl rand -hex 32 > "/srv/dla-ci-data/secrets/$name"
          done
          # Negative tests: each "required variable ... is missing a value"
          # message in this log is EXPECTED (Compose refusing on purpose);
          # "ok: refused as expected" follows it. Every positive check names
          # itself and prints the expected and actual values when it fails.
          refuse() { if "$@"; then echo "UNEXPECTED SUCCESS: $*" >&2; exit 1; fi; echo "ok: refused as expected: $*"; }
          expect() { if [ "$2" != "$3" ]; then printf '::error::%s\nexpected: %s\nactual:   %s\n' "$1" "$3" "$2" >&2; exit 1; fi; echo "ok: $1"; }
          # Fail closed: no default bind address or port for the published port.
          refuse docker compose -f docker-compose.prod.yml --env-file .env.production config --quiet
          # CI only: throwaway port and edge subnet (production: checked by the owner).
          echo 'DLA_HTTP_PORT=8089' >> .env.production
          echo 'DLA_EDGE_SUBNET=172.30.89.0/29' >> .env.production
          echo 'DLA_EDGE_GATEWAY=172.30.89.1' >> .env.production
          docker compose -f docker-compose.prod.yml --env-file .env.production config --quiet
          # Only nginx publishes, one port, on the configured address.
          published=$(docker compose -f docker-compose.prod.yml --env-file .env.production config --format json | jq -c '[.services | to_entries[] | select((.value.ports // []) | length > 0) | {service: .key, ports: [.value.ports[] | {host_ip, published: (.published | tostring), target}]}]')
          expect 'published ports' "$published" '[{"service":"nginx","ports":[{"host_ip":"127.0.0.1","published":"8089","target":8080}]}]'
          # Persistent storage: no default root (Compose refuses to run
          # without it), and exactly these bind mounts, none created on demand.
          refuse env DLA_STORAGE_ROOT= docker compose -f docker-compose.prod.yml --env-file .env.production config --quiet
          refuse env DLA_DATA_ROOT= docker compose -f docker-compose.prod.yml --env-file .env.production config --quiet
          # The Docker daemon never starts these containers by itself (only
          # digital-library.service does, after the storage preflight).
          expect 'restart policies' "$(docker compose -f docker-compose.prod.yml --env-file .env.production --profile ops config --format json | jq -c '[.services[] | .restart] | unique')" '["no"]'
          # Every mount from the two data roots (the read-only repository
          # files under ./docker are checked elsewhere): service, type,
          # source, target and read-only flag, and no named volume.
          # create_host_path is NOT compared here: Compose may omit
          # "create_host_path: false" from its normalised JSON (null is not
          # proof of false). It is asserted on the YAML itself
          # (PersistentStorageTest) and proven at runtime in the
          # production-stack job ("Compose refuses a missing bind source").
          storage=$(docker compose -f docker-compose.prod.yml --env-file .env.production --profile ops config --format json | jq -cS '{named_volumes: ((.volumes // {}) | keys), services: [.services | to_entries[] | {service: .key, mounts: ([(.value.volumes // [])[] | select(.type != "bind" or ((.source // "") | (startswith("/mnt/") or startswith("/srv/dla-ci-data/")))) | {type, source, target, read_only: (.read_only // false)}] | sort_by(.target))}] | sort_by(.service)}')
          expect 'storage mounts' "$storage" '{"named_volumes":[],"services":[{"mounts":[{"read_only":true,"source":"/srv/dla-ci-data/mysql-init-guard","target":"/run/dla-db-init","type":"bind"},{"read_only":false,"source":"/srv/dla-ci-data/mysql","target":"/var/lib/mysql","type":"bind"}],"service":"db"},{"mounts":[],"service":"nginx"},{"mounts":[{"read_only":false,"source":"/mnt/bravina-shared/digital-library/storage","target":"/var/www/html/storage","type":"bind"},{"read_only":false,"source":"/mnt/bravina-shared/digital-library/backups","target":"/var/www/html/storage/backups","type":"bind"},{"read_only":false,"source":"/mnt/bravina-shared/digital-library/covers","target":"/var/www/html/storage/covers","type":"bind"}],"service":"ops"},{"mounts":[{"read_only":false,"source":"/mnt/bravina-shared/digital-library/storage","target":"/var/www/html/storage","type":"bind"},{"read_only":false,"source":"/mnt/bravina-shared/digital-library/covers","target":"/var/www/html/storage/covers","type":"bind"}],"service":"php"}]}'
          # Secrets come from the data root, outside the checkout.
          expect 'secret files' "$(docker compose -f docker-compose.prod.yml --env-file .env.production config --format json | jq -c '[.secrets[].file] | sort')" '["/srv/dla-ci-data/secrets/db_migration_password","/srv/dla-ci-data/secrets/db_password","/srv/dla-ci-data/secrets/db_root_password"]'

  production-stack:
    name: Production images, hardening and restore drill
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: static
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare throwaway configuration and secrets
        run: |
          cp .env.production.example .env.production
          # CI only: explicitly no trusted proxy, with the trust-nothing policy.
          # The real ingress policy is decided after the topology review.
          echo 'DLA_TRUSTED_PROXY=none' >> .env.production
          # CI only: throwaway port and edge subnet. DLA_HTTP_BIND=127.0.0.1
          # comes from the template.
          echo 'DLA_HTTP_PORT=8089' >> .env.production
          echo 'DLA_EDGE_SUBNET=172.30.89.0/29' >> .env.production
          echo 'DLA_EDGE_GATEWAY=172.30.89.1' >> .env.production
          cp docker/nginx/client-ip.conf docker/nginx/production/client-ip.conf
          # CI only: the checkout stands in for the working tree
          # /opt/digital-library, /srv/dla-ci-data for the data root
          # /opt/digital-library-data (outside the checkout, as in
          # production), and the HDD root is under a stand-in for its
          # mountpoint.
          app=$PWD
          data=/srv/dla-ci-data
          root=/srv/dla-ci/digital-library
          sed -i "s#^DLA_DATA_ROOT=.*#DLA_DATA_ROOT=$data#" .env.production
          sed -i "s#^DLA_STORAGE_ROOT=.*#DLA_STORAGE_ROOT=$root#" .env.production
          test "$(grep -c '^DLA_DATA_ROOT=' .env.production)" = 1
          test "$(grep -c '^DLA_STORAGE_ROOT=' .env.production)" = 1
          sudo install -d -o root -g root -m 0755 /srv/dla-ci
          # The owner's initialisation (docs/DEPLOYMENT.md 3.2), verbatim:
          sudo install -d -o "$(id -un)" -g "$(id -gn)" -m 0755 "$app"
          sudo install -d -o root -g root -m 0755 "$data"
          sudo install -d -o 999 -g 999 -m 0700 "$data/mysql"
          sudo install -d -o root -g root -m 0700 "$data/secrets"
          sudo install -d -o root -g root -m 0755 "$data/mysql-init-guard"
          sudo install -d -o root -g root -m 0700 "$root"
          sudo install -d -o 82 -g 82 -m 0750 "$root/storage"
          sudo install -d -o 82 -g 82 -m 0750 "$root/storage/tmp" "$root/storage/logs" "$root/storage/cache"
          sudo install -d -o root -g root -m 0755 "$root/storage/covers"
          sudo install -d -o root -g root -m 0000 "$root/storage/backups"
          sudo install -d -o 82 -g 82 -m 0750 "$root/covers"
          sudo install -d -o 82 -g 82 -m 0700 "$root/backups"
          # The owner's secrets (docs/DEPLOYMENT.md 2), verbatim:
          for name in db_root_password db_password db_migration_password; do
            sudo sh -c "umask 077 && openssl rand -hex 32 > '$data/secrets/$name'"
          done
          sudo chown 999:999 "$data/secrets/db_root_password"
          sudo chmod 0400 "$data/secrets/db_root_password"
          sudo chown 82:999 "$data/secrets/db_password" "$data/secrets/db_migration_password"
          sudo chmod 0440 "$data/secrets/db_password" "$data/secrets/db_migration_password"
          # The privileged preflight: a root-owned installed copy (3.2), verbatim.
          sudo install -o root -g root -m 0755 "$app/docker/storage/preflight.sh" /usr/local/sbin/digital-library-preflight
          test "$(stat -c '%u %a' /usr/local/sbin/digital-library-preflight)" = '0 755'
          cmp docker/storage/preflight.sh /usr/local/sbin/digital-library-preflight
          # First deployment: authorise exactly one new, empty database
          # (docs/DEPLOYMENT.md 6); withdrawn after the first start.
          sudo touch "$data/mysql-init-guard/allow-empty-init"
          # No production data in the checkout or the build context.
          test -z "$(git ls-files -- mysql secrets mysql-init-guard)"
          for path in mysql secrets mysql-init-guard; do test ! -e "$path"; done

      - name: Build the production images
        run: docker compose -f docker-compose.prod.yml --env-file .env.production build

      # The production CPU (Pentium E5300) has SSE2/SSE3/SSSE3 but no
      # SSE4.1, SSE4.2 or POPCNT. mysql:8.4 (Oracle Linux 9) needs
      # x86-64-v2 and cannot start there. MariaDB (Ubuntu noble): glibc and
      # mariadbd require only the x86-64 baseline (ELF ISA note); its faster
      # CRC-32 paths are chosen at run time by cpuid. PHP-FPM, its
      # extensions (including pdo_mysql and gd built here), musl and nginx
      # contain no instruction beyond SSSE3 at all. Libraries with run-time
      # CPU dispatch (OpenSSL, libsodium, libjpeg-turbo, libwebp...) are not
      # scanned. The runner's CPU cannot prove this by running the images.
      - name: CPU baseline of the production images
        run: |
          set -eux
          dc() { docker compose -f docker-compose.prod.yml --env-file .env.production "$@"; }
          beyond_ssse3() { objdump -d --no-show-raw-insn "$1" | grep -cP ':\t(?:(?:rep[a-z]*|lock|notrack|bnd) )*(?:pblendvb|blendv?p[sd]|dpp[sd]|extractps|insertps|movntdqa|mpsadbw|packusdw|pcmpeqq|pextr[bdq]|pinsr[bdq]|pmax(?:sb|sd|ud|uw)|pmin(?:sb|sd|ud|uw)|pmov[sz]x[bwd][wdq]|pmuldq|pmulld|ptest|round[ps][sd]|phminposuw|crc32[bwlq]?|pcmp[ei]str[im]|pcmpgtq|popcnt|lzcnt|v[a-z][a-z0-9]*)\s' || true; }
          work=$(mktemp -d "$RUNNER_TEMP/dla-isa.XXXXXX")
          db=$(docker create "$(dc config --format json | jq -r '.services.db.image')")
          docker cp -L "$db:/usr/sbin/mariadbd" "$work/mariadbd"
          docker cp -L "$db:/usr/lib/x86_64-linux-gnu/libc.so.6" "$work/libc.so.6"
          docker rm "$db"
          for f in mariadbd libc.so.6; do
            readelf -n "$work/$f" | grep -F 'x86 ISA needed: x86-64-baseline'
            if readelf -n "$work/$f" | grep -E 'x86 ISA needed:.*x86-64-v[234]'; then echo "::error::$f requires more than the x86-64 baseline" >&2; exit 1; fi
          done
          # The SSE4.2/PCLMUL CRC-32 code is reached only through these cpuid checks.
          nm -D "$work/mariadbd" | grep -E ' T (crc32c_x86_available|crc32_pclmul_enabled)$'
          php=$(docker create "$(dc config --format json | jq -r '.services.php.image')")
          docker cp -L "$php:/usr/local/sbin/php-fpm" "$work/php-fpm"
          docker cp -L "$php:/usr/local/bin/php" "$work/php"
          docker cp -L "$php:/lib/ld-musl-x86_64.so.1" "$work/ld-musl-x86_64.so.1"
          docker cp "$php:/usr/local/lib/php/extensions" "$work/extensions"
          docker rm "$php"
          nginx=$(docker create "$(dc config --format json | jq -r '.services.nginx.image')")
          docker cp -L "$nginx:/usr/sbin/nginx" "$work/nginx"
          docker rm "$nginx"
          ls "$work"/extensions/*/pdo_mysql.so "$work"/extensions/*/gd.so
          for f in "$work/php-fpm" "$work/php" "$work/ld-musl-x86_64.so.1" "$work/nginx" "$work"/extensions/*/*.so; do
            n=$(beyond_ssse3 "$f")
            echo "$n instructions beyond SSSE3: $f"
            if [ "$n" != 0 ]; then echo "::error::$f uses instructions the production CPU lacks" >&2; exit 1; fi
          done
          rm -rf -- "$work"

      - name: Start the stack and wait for every health check
        run: |
          set -eux
          docker compose -f docker-compose.prod.yml --env-file .env.production up -d --wait --wait-timeout 300
          docker compose -f docker-compose.prod.yml --env-file .env.production logs db | grep -F 'first deployment is authorised: initialising a NEW database'
          # The first start is done: withdraw the authorisation (DEPLOYMENT.md 6).
          sudo rm /srv/dla-ci-data/mysql-init-guard/allow-empty-init

      - name: Database engine, accounts and privileges
        run: |
          set -eux
          dc() { docker compose -f docker-compose.prod.yml --env-file .env.production "$@"; }
          refuse() { if "$@"; then echo "UNEXPECTED SUCCESS: $*" >&2; exit 1; fi; }
          expect() { if [ "$2" != "$3" ]; then printf '::error::%s\nexpected: %s\nactual:   %s\n' "$1" "$3" "$2" >&2; exit 1; fi; echo "ok: $1"; }
          # Administrative account: root@localhost only, through the socket
          # inside the db container, with the root secret file.
          rootsql() { dc exec -T db sh -c 'MYSQL_PWD="$(cat /run/secrets/db_root_password)" exec mariadb --protocol=socket -uroot -N -e "$1"' sh "$1"; }
          version=$(rootsql 'SELECT VERSION()' | tr -d '\r')
          case "$version" in 11.4.*-MariaDB*) echo "server: $version" ;; *) echo "::error::unexpected server $version" >&2; exit 1 ;; esac
          app=$(dc config --format json | jq -r '.services.db.environment.DB_USERNAME')
          mig=$(dc config --format json | jq -r '.services.db.environment.DB_MIGRATION_USERNAME')
          db=$(dc config --format json | jq -r '.services.db.environment.MARIADB_DATABASE')
          expect 'accounts' "$(rootsql "SELECT CONCAT(User, '@', Host) FROM mysql.user ORDER BY 1" | tr -d '\r' | paste -sd' ')" "healthcheck@127.0.0.1 healthcheck@::1 healthcheck@localhost $app@% $mig@% mariadb.sys@localhost root@localhost"
          grants() { rootsql "SHOW GRANTS FOR '$1'@'$2'" | tr -d '\r' | grep -v '^GRANT USAGE ON \*\.\* TO' | paste -sd'|'; }
          expect 'application grants' "$(grants "$app" %)" "GRANT SELECT, INSERT, UPDATE, DELETE ON \`$db\`.* TO \`$app\`@\`%\`"
          expect 'migration grants' "$(grants "$mig" %)" "GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, REFERENCES, INDEX, ALTER ON \`$db\`.* TO \`$mig\`@\`%\`"
          for host in localhost 127.0.0.1 ::1; do expect "healthcheck@$host grants" "$(grants healthcheck "$host" || true)" ''; done
          # Root is refused over TCP (only root@localhost exists).
          refuse dc exec -T db sh -c 'MYSQL_PWD="$(cat /run/secrets/db_root_password)" exec mariadb -h 127.0.0.1 -uroot -e "SELECT 1"'
          # The initialisation finished: the guard's completion marker.
          dc exec -T db test -f /var/lib/mysql/.dla-init-complete

      # Independent of the stack and of Compose's normalised output: does THIS
      # runner's Compose honour "create_host_path: false"? A throwaway
      # one-service project (its own name, a fresh directory under
      # RUNNER_TEMP, the already-pulled pinned MariaDB image, nothing else) has
      # a bind source that does not exist. Compose must refuse it, and the
      # source must not be created. A control run with the source present
      # must succeed, so the refusal is due to the missing source alone.
      # Any other result fails CI and prints the Docker and Compose versions.
      - name: Compose refuses a missing bind source (create_host_path false)
        run: |
          set -eux
          docker version --format 'Docker Engine {{.Server.Version}} (API {{.Server.APIVersion}})'
          docker compose version
          image=$(docker compose -f docker-compose.prod.yml --env-file .env.production config --format json | jq -r '.services.db.image')
          test -n "$image"
          probe=$(mktemp -d "$RUNNER_TEMP/dla-create-host-path.XXXXXX")
          project=dla-create-host-path-probe
          missing="$probe/missing-source"
          cleanup() { docker compose -p "$project" -f "$probe/compose.yml" down --remove-orphans || true; rm -rf -- "$probe"; }
          trap cleanup EXIT
          cat > "$probe/compose.yml" <<EOF
          services:
            probe:
              image: $image
              pull_policy: never
              entrypoint:
                - "true"
              restart: "no"
              volumes:
                - type: bind
                  source: $missing
                  target: /probe
                  bind:
                    create_host_path: false
          EOF
          cat "$probe/compose.yml"
          test ! -e "$missing"
          if out=$(docker compose -p "$project" -f "$probe/compose.yml" up -d 2>&1); then
            printf '%s\n' "$out"
            echo "::error::Compose created and started a container whose bind source does not exist: create_host_path false was ignored ($(docker compose version --short), Docker $(docker version --format '{{.Server.Version}}'))" >&2
            exit 1
          fi
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -F 'source path does not exist'
          if [ -e "$missing" ]; then
            echo "::error::the missing bind source was created ($(docker compose version --short), Docker $(docker version --format '{{.Server.Version}}'))" >&2
            exit 1
          fi
          # Control: the same project with the source present is accepted.
          mkdir "$missing"
          docker compose -p "$project" -f "$probe/compose.yml" up -d
          docker compose -p "$project" -f "$probe/compose.yml" down --remove-orphans

      - name: Check the hardening
        run: |
          set -eux
          dc() { docker compose -f docker-compose.prod.yml --env-file .env.production "$@"; }
          # "! cmd" never fails a "set -e" script; this does.
          refuse() { if "$@"; then echo "UNEXPECTED SUCCESS: $*" >&2; exit 1; fi; }
          dc ps
          # End to end: nginx -> PHP-FPM -> MariaDB.
          test "$(dc exec -T nginx wget -q -O - http://127.0.0.1:8080/health)" = '{"status":"ok"}'
          dc exec -T nginx wget -q -O /dev/null http://127.0.0.1:8080/assets/css/app.css
          # Exactly one published port: nginx, on the configured address only.
          # Structured (docker inspect), never the human-readable {{.Ports}}
          # column, which also lists exposed-only ports (the nginx base
          # image's EXPOSE 80). Both the requested bindings and the bindings
          # Docker actually made must match exactly: no wildcard address, no
          # extra mapping or port, no publish-all, for every running service.
          ids=$(docker ps -q --filter label=com.docker.compose.project=digital-library-prod)
          test -n "$ids"
          inspected=$(docker inspect $ids)
          expected='[{"bindings":[],"publish_all":false,"service":"db"},{"bindings":[{"container_port":"8080/tcp","host_ip":"127.0.0.1","host_port":"8089"}],"publish_all":false,"service":"nginx"},{"bindings":[],"publish_all":false,"service":"php"}]'
          requested=$(printf '%s' "$inspected" | jq -cS '[.[] | {service: .Config.Labels["com.docker.compose.service"], publish_all: .HostConfig.PublishAllPorts, bindings: ([(.HostConfig.PortBindings // {}) | to_entries[] | .key as $port | (.value // [])[] | {container_port: $port, host_ip: .HostIp, host_port: .HostPort}] | sort_by(.container_port, .host_ip, .host_port))}] | sort_by(.service)')
          actual=$(printf '%s' "$inspected" | jq -cS '[.[] | {service: .Config.Labels["com.docker.compose.service"], publish_all: .HostConfig.PublishAllPorts, bindings: ([(.NetworkSettings.Ports // {}) | to_entries[] | .key as $port | (.value // [])[] | {container_port: $port, host_ip: .HostIp, host_port: .HostPort}] | sort_by(.container_port, .host_ip, .host_port))}] | sort_by(.service)')
          test "$requested" = "$expected"
          test "$actual" = "$expected"
          # Persistent storage, from the same inspect data: exactly the
          # expected bind mounts from the storage root (no named or anonymous
          # volume, e.g. from the MariaDB image's VOLUME), requested through the
          # Mounts API without CreateMountpoint (a missing source fails).
          root=/srv/dla-ci/digital-library
          data=/srv/dla-ci-data
          mounts=$(printf '%s' "$inspected" | jq -cS --arg hdd "$root/" --arg data "$data/" 'def ours: (.Source // "") | (startswith($hdd) or startswith($data)); def secret: ((.Destination // .Target // "") | startswith("/run/secrets/")); [.[] | {service: .Config.Labels["com.docker.compose.service"], mounts: ([.Mounts[] | select((.Type == "volume" or ours) and (secret | not)) | {type: .Type, source: .Source, target: .Destination, rw: .RW}] | sort_by(.target)), create_mountpoint: ([(.HostConfig.Mounts // [])[] | select(ours and (secret | not)) | (.BindOptions.CreateMountpoint // false)] | unique)}] | sort_by(.service)')
          test "$mounts" = '[{"create_mountpoint":[false],"mounts":[{"rw":false,"source":"/srv/dla-ci-data/mysql-init-guard","target":"/run/dla-db-init","type":"bind"},{"rw":true,"source":"/srv/dla-ci-data/mysql","target":"/var/lib/mysql","type":"bind"}],"service":"db"},{"create_mountpoint":[],"mounts":[],"service":"nginx"},{"create_mountpoint":[false],"mounts":[{"rw":true,"source":"/srv/dla-ci/digital-library/storage","target":"/var/www/html/storage","type":"bind"},{"rw":true,"source":"/srv/dla-ci/digital-library/covers","target":"/var/www/html/storage/covers","type":"bind"}],"service":"php"}]'
          # Database files are not reachable from the web or nginx containers.
          refuse dc exec -T php test -e /var/lib/mysql/.dla-init-complete
          refuse dc exec -T nginx test -e /var/lib/mysql/.dla-init-complete
          # Restart policy "no" on every container, as Docker holds it: the
          # daemon restores none of them at boot or after an unclean shutdown.
          policies=$(printf '%s' "$inspected" | jq -cS '[.[] | {service: .Config.Labels["com.docker.compose.service"], restart: (.HostConfig.RestartPolicy.Name | if . == "" then "no" else . end)}] | sort_by(.service)')
          test "$policies" = '[{"restart":"no","service":"db"},{"restart":"no","service":"nginx"},{"restart":"no","service":"php"}]'
          # The web container cannot use the backups mountpoint stub.
          refuse dc exec -T php touch /var/www/html/storage/backups/ci-write-test
          dc exec -T php touch /var/www/html/storage/covers/ci-write-test
          dc exec -T php rm /var/www/html/storage/covers/ci-write-test
          # Through the published port, as cloudflared connects (plain HTTP,
          # public Host header): health, a secure host-only session cookie
          # and HSTS although the origin leg is not TLS, and no foreign Host.
          origin=http://127.0.0.1:8089
          test "$(curl -fsS -H 'Host: library.bravina.co.uk' "$origin/health")" = '{"status":"ok"}'
          headers=$(curl -fsS -o /dev/null -D - -H 'Host: library.bravina.co.uk' "$origin/login" | tr -d '\r')
          printf '%s\n' "$headers" | grep -Eqi '^set-cookie: __Host-[^=]+=[^;]+; path=/; secure; HttpOnly; SameSite=Lax$'
          printf '%s\n' "$headers" | grep -Eqi '^strict-transport-security: max-age=31536000; includeSubDomains$'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' "$origin/login")" = 400
          # PHP-FPM and MariaDB are not reachable from the host.
          refuse curl -s --max-time 5 -o /dev/null http://127.0.0.1:9000/
          refuse curl -s --max-time 5 -o /dev/null http://127.0.0.1:3306/
          # Unprivileged users and read-only root filesystems.
          test "$(dc exec -T php id -u)" = 82
          test "$(dc exec -T nginx id -u)" = 101
          refuse dc exec -T php touch /var/www/html/ci-write-test
          refuse dc exec -T nginx touch /etc/nginx/ci-write-test
          # The web container holds only the runtime credentials.
          dc exec -T php test -r /run/secrets/db_password
          refuse dc exec -T php test -e /run/secrets/db_migration_password
          refuse dc exec -T php test -e /run/secrets/db_root_password
          # Operations commands are refused in the web container.
          refuse dc exec -T php php bin/console backup:create
          # The configuration validates cleanly in both roles.
          dc exec -T php php bin/console config:check --strict
          dc run --rm -T ops php bin/console config:check --strict
          # A foreign Host header is refused by the application.
          refuse dc exec -T nginx wget -q -O /dev/null --header 'Host: evil.example' http://127.0.0.1:8080/login

      - name: Migrate, back up and verify
        run: |
          set -eux
          dc() { docker compose -f docker-compose.prod.yml --env-file .env.production "$@"; }
          dc run --rm -T ops php bin/console migrate
          status=$(dc run --rm -T ops php bin/console migrate:status)
          printf '%s\n' "$status"
          printf '%s\n' "$status" | grep -F 'Database engine: MariaDB'
          printf '%s\n' "$status" | grep -F 'applied      2026_10_13_155739_create_wishlist_items_table (MariaDB variant)'
          openssl rand -hex 16 | dc run --rm -T ops php bin/console user:create --email=ci-admin@example.org --name="CI Admin" --role=admin
          dc run --rm -T ops php bin/console backup:create
          dc run --rm -T ops sh -c 'for f in storage/backups/dla-backup-*.tar.gz; do php bin/console backup:verify --file="$f"; done'

      - name: Restore drill (maintenance mode, web PHP stopped)
        run: |
          set -eux
          dc() { docker compose -f docker-compose.prod.yml --env-file .env.production "$@"; }
          archive=$(dc run --rm -T ops sh -c 'ls -1 storage/backups/dla-backup-*.tar.gz | tail -n 1' | tr -d '\r')
          dc run --rm -T ops php bin/console maintenance:on --reason="CI restore drill"
          dc stop php
          dc run --rm -T ops php bin/console backup:restore --file="$archive" --confirm=library --replace --allow-production
          dc run --rm -T ops php bin/console maintenance:status
          if dc run --rm -T ops php bin/console maintenance:status | grep -q 'INCOMPLETE RESTORE'; then
            echo "The restore left an incomplete-restore marker" >&2
            exit 1
          fi
          dc up -d --wait --wait-timeout 300 php nginx
          dc run --rm -T ops php bin/console maintenance:off
          test "$(dc exec -T nginx wget -q -O - http://127.0.0.1:8080/health)" = '{"status":"ok"}'

      - name: Trusted peer on the published port (as the host's cloudflared)
        run: |
          set -eux
          dc() { docker compose -f docker-compose.prod.yml --env-file .env.production "$@"; }
          # The production policy, with the edge gateway as the only trusted peer.
          sed 's/<CLOUDFLARED_ADDRESS>/172.30.89.1/' docker/nginx/client-ip.cloudflared.conf.example > docker/nginx/production/client-ip.conf
          sed -i 's/^DLA_TRUSTED_PROXY=none$/DLA_TRUSTED_PROXY=required/' .env.production
          dc up -d --wait --wait-timeout 300 nginx
          origin=http://127.0.0.1:8089
          # A local process on 127.0.0.1, like cloudflared, with the edge header.
          curl -fsS -o /dev/null -H 'Host: library.bravina.co.uk' -H 'CF-Connecting-IP: 198.51.100.23' "$origin/login"
          # Without a client address: refused; /health stays open for probes.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: library.bravina.co.uk' "$origin/login")" = 403
          test "$(curl -fsS -H 'Host: library.bravina.co.uk' "$origin/health")" = '{"status":"ok"}'
          # The access log: the client address from the header, the TCP peer
          # is the edge gateway (the address the policy trusts).
          dc logs --no-color nginx | grep -Eq '198\.51\.100\.23 - .*peer=172\.30\.89\.1$'

      - name: Missing or unexpected storage fails closed (no Docker daemon restart)
        run: |
          set -eux
          dc() { docker compose -f docker-compose.prod.yml --env-file .env.production "$@"; }
          refuse() { if "$@"; then echo "UNEXPECTED SUCCESS: $*" >&2; exit 1; fi; }
          root=/srv/dla-ci/digital-library
          data=/srv/dla-ci-data
          db=$(dc ps -q db)
          php=$(dc ps -q php)
          # The global Docker daemon is never restarted: with restart policy
          # "no" (checked above) it starts none of these containers itself.
          # Each case: the boot unit's stop command, the change, then Docker
          # and the unit's start command must refuse it.
          #
          # 1. The storage HDD is not mounted (the stand-in mountpoint stays,
          #    empty): php cannot start; nothing is created in its place.
          dc stop
          sudo mv "$root" /srv/dla-ci-hdd-detached
          if out=$(docker start "$php" 2>&1); then echo "UNEXPECTED SUCCESS: docker start php" >&2; exit 1; fi
          printf '%s\n' "$out" | grep -F 'source path does not exist'
          refuse dc up -d --no-recreate --no-build --pull never --wait --wait-timeout 60
          dc stop
          test ! -e "$root"
          test -z "$(sudo find /srv/dla-ci -mindepth 1 -print -quit)"
          sudo mv /srv/dla-ci-hdd-detached "$root"
          #
          # 2. The SSD database directory is replaced by an empty one (wrong
          #    path, lost data): the guard refuses to initialise a new database.
          sudo mv "$data/mysql" "$data/mysql-detached"
          sudo install -d -o 999 -g 999 -m 0700 "$data/mysql"
          refuse dc up -d --no-recreate --no-build --pull never --wait --wait-timeout 60 db
          dc logs db | grep -F 'refusing to initialise a new, empty database'
          dc stop
          test -z "$(sudo find "$data/mysql" -mindepth 1 -print -quit)"
          #
          # 3. The SSD database directory is missing: db cannot start, and
          #    nothing is created in its place.
          sudo rmdir "$data/mysql"
          if out=$(docker start "$db" 2>&1); then echo "UNEXPECTED SUCCESS: docker start db" >&2; exit 1; fi
          printf '%s\n' "$out" | grep -F 'source path does not exist'
          test ! -e "$data/mysql"
          sudo mv "$data/mysql-detached" "$data/mysql"
          #
          # 4. The guard's completion marker is missing (an initialisation
          #    that stopped half-way, accounts possibly incomplete): refused.
          sudo mv "$data/mysql/.dla-init-complete" "$data/dla-init-complete.detached"
          refuse dc up -d --no-recreate --no-build --pull never --wait --wait-timeout 60 db
          dc logs db | grep -F 'initialisation did not finish'
          dc stop
          sudo mv "$data/dla-init-complete.detached" "$data/mysql/.dla-init-complete"
          #
          # Both back: the unit's start command, the same data.
          dc up -d --no-recreate --no-build --pull never --wait --wait-timeout 300
          test "$(dc exec -T nginx wget -q -O - http://127.0.0.1:8080/health)" = '{"status":"ok"}'
          status=$(dc run --rm -T ops php bin/console migrate:status)
          printf '%s\n' "$status"
          printf '%s\n' "$status" | grep -q applied
          if printf '%s\n' "$status" | grep -Eqi 'pending|modified'; then exit 1; fi

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file .env.production logs --no-color --tail 200

      - name: Remove the stack
        if: always()
        run: docker compose -f docker-compose.prod.yml --env-file .env.production down -v --remove-orphans
